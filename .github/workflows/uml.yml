name: uml

# The guest's lint and build, the kernel style check, and the end-to-end
# tests in UML. They run on a push only when what they check changes (the
# guest, the kernel tree and our modules, the Python package, the tests,
# the build), and on demand otherwise. The newest-mainline tripwire runs
# only on demand.
on:
  push:
    branches: [main, "claude/**"]
    paths: &checked
      - "guest/**"
      - "kernel/**"
      - "third_party/linux/**"
      - "src/**"
      - "tests/**"
      - "scripts/build-uml.sh"
      - "scripts/build-guest.sh"
      - "scripts/check-kernel.sh"
      - "uv.lock"
      - ".github/actions/uml/**"
      - ".github/workflows/uml.yml"
  pull_request:
    paths: *checked
  workflow_dispatch:
    inputs:
      mainline:
        description: also build and test against the newest mainline kernel
        type: boolean
        default: false

permissions: {}

concurrency:
  group: uml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: rust guest (fmt, clippy, x86_64 musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: guest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: guest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            guest/target
          key: rust-${{ runner.os }}-${{ hashFiles('guest/Cargo.lock', 'guest/rust-toolchain.toml') }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --target x86_64-unknown-linux-musl -- -D warnings
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl

  uml:
    name: uml (7.0 build, kernel style, end-to-end tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: scripts/check-kernel.sh
      - uses: ./.github/actions/uml
      - run: uv sync --locked --extra train
      - name: end-to-end tests in UML
        env:
          EXPLICCIT_UML_DIR: build/uml
        run: uv run pytest -q -m uml
      - name: smoke campaign through the CLI
        run: |
          uv run expliccit campaign plan examples/campaign-smoke.json build/smoke
          uv run expliccit campaign run build/smoke --build build/uml --workers "$(nproc)"
          uv run expliccit campaign status build/smoke

  mainline:
    name: newest mainline (tripwire, on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.mainline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q flex bison bc libelf-dev musl-tools
      - name: unpack mainline and apply our kernel patches
        env:
          DEST: ${{ runner.temp }}/linux-mainline
        run: uv run --no-project python tools/ci/mainline_tree.py "$DEST"
      - name: build and run the UML tests against mainline
        env:
          KERNEL_SRC: ${{ runner.temp }}/linux-mainline
          EXPLICCIT_UML_DIR: build/uml-mainline
        run: |
          scripts/build-uml.sh build/uml-mainline
          (cd guest && rustup toolchain install)
          scripts/build-guest.sh build/uml-mainline
          uv sync --locked
          uv run pytest -q -m uml
