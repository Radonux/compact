name: ci

# The checks every code change needs: Python lint, types and unit tests,
# and workflow and shell lint. A commit that changes only docs runs nothing.
# The UML build and end-to-end tests are uml.yml.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: &docs ["**.md", "docs/**", ".claude/**"]
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions: {}

# Every commit on main is checked to the end, each in its own group; on
# other branches and pull requests a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: python (lint, types, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            tests
            examples
            experiments
            tools
            kernel/modules
            guest/src
            third_party/mahimahi/scripts
            third_party/expliccit-models
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Mahak reference checkout (for the trace, metric and driver tests)
        env:
          MAHAK_DIR: ${{ runner.temp }}/mahak
        run: |
          git clone --quiet https://github.com/Ppazhooh/mahak "$MAHAK_DIR"
          git -C "$MAHAK_DIR" checkout --quiet 507758332a33d97a102a0a801162925bdb0a9669
      - run: uv sync --locked --extra train
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pyright
      - name: pytest (UML tests skip here; uml.yml runs them)
        env:
          EXPLICCIT_MAHAK_DIR: ${{ runner.temp }}/mahak
        run: uv run pytest -q

  workflows:
    name: workflow and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            tools
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.31.1 --offline .github/workflows
      - run: shellcheck scripts/*.sh tools/m0/*.sh
